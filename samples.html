<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meshy sample review</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
    #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; background: #0009; z-index: 2; }
    #bar button { background: #222; color: #eee; border: 1px solid #444; padding: 6px 10px; cursor: pointer; border-radius: 4px; }
    #bar button.on { border-color: #e0a020; color: #e0a020; }
    #info { position: fixed; bottom: 10px; left: 10px; background: #0009; padding: 8px 10px; border-radius: 4px; z-index: 2; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="info">Drag to orbit · wheel to zoom · right-drag to pan</div>
  <script type="module" src="/src/samples.ts"></script>
</body>
</html>
